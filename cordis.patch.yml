# dsh-win-notify bundle patch: Windows task-completion toast notifications.
#
# Install the bundle into a profile with:
#   dsh plugin --profile <name> add github:MuziIsabel/dsh-win-notify
#
# The loader resolves the bare package name 'dsh-win-notify' from the
# profile's node_modules. Configuration options:
#   enabled        enable the plugin (default true)
#   sound          notification sound: default | reminder | sms | alarm | silent
#   onError        also notify on task errors (default true)
#   title          notification title (default "DeepSeek Harness")
#   body           completion text (default "任务已完成")
#   bodyError      error text (default "任务出错")
#   maxPromptChars max length of the user prompt shown in the body (default 64)
#   approval       notify when waiting for user approval (default true)
#   approvalWaitMs notify only if still undecided after this delay in ms (default 3000)
#   bodyApproval   approval-waiting text (default "等待用户审批")
#   maxReasonChars max length of the approval reason shown (default 80)
- insert:
    - id: win-notify
      name: 'dsh-win-notify'
      config:
        enabled: true
        sound: default
